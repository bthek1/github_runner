---
- name: Configure WireGuard VPN on gh-runner
  hosts: gh_runner
  become: true

  vars:
    container_vpn_ip: "10.8.0.8"
    vpn_server_pubkey: "f6ki/InnhoO5nXqfddvZoE1xaPKoXnwEC5vCA0Wj5Ww="
    vpn_server_endpoint: "3.104.200.207:51820"
    wg_privatekey_file: "{{ playbook_dir }}/../terraform/wireguard/wg_privatekey"

  tasks:
    - name: Install wireguard-tools
      apt:
        name: wireguard-tools
        state: present
        update_cache: true

    - name: Write WireGuard client config
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
        content: |
          [Interface]
          PrivateKey = {{ lookup('file', wg_privatekey_file) | trim }}
          Address = {{ container_vpn_ip }}/24
          DNS = 10.8.0.1

          [Peer]
          PublicKey = {{ vpn_server_pubkey }}
          Endpoint = {{ vpn_server_endpoint }}
          AllowedIPs = 10.8.0.0/24
          PersistentKeepalive = 25

    - name: Enable and start wg-quick@wg0
      systemd:
        name: wg-quick@wg0
        enabled: true
        state: started

    - name: Restore clean eth0.network (remove workaround route)
      copy:
        dest: /etc/systemd/network/eth0.network
        content: |
          [Match]
          Name = eth0

          [Network]
          Description = Interface eth0 autoconfigured by PVE
          Address = 192.168.2.101/24
          Gateway = 192.168.2.1
          DHCP = no
          IPv6AcceptRA = false

    - name: Remove workaround route (runtime, ignore if already gone)
      command: ip route del 10.8.0.0/24 via 192.168.2.70 dev eth0
      ignore_errors: true
      changed_when: false

    - name: Reload systemd-networkd
      systemd:
        name: systemd-networkd
        state: reloaded

    - name: Verify VPN is up (ping DNS server)
      command: ping -c 3 -W 2 10.8.0.1
      register: ping_result
      changed_when: false

    - name: Verify DNS resolves through VPN
      command: nslookup github.com 10.8.0.1
      register: dns_result
      changed_when: false

    - name: Show verification results
      debug:
        msg:
          - "Ping: {{ ping_result.stdout_lines[-1] }}"
          - "DNS:  {{ dns_result.stdout_lines | select('search', 'Address') | list }}"

- name: Revert IP forwarding workaround on Proxmox host
  hosts: proxmox
  become: true

  tasks:
    - name: Remove ip_forward line added as workaround on 2026-06-01
      lineinfile:
        path: /etc/sysctl.conf
        line: "net.ipv4.ip_forward = 1"
        state: absent

    - name: Apply sysctl (disables forwarding)
      command: sysctl -p
      changed_when: false
